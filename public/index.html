<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Office - 8 Channels</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0 0 15px 0; font-size: 18px; color: #555; }
        
        /* สไตล์ปุ่ม Switch */
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(26px); }
        
        .controls { text-align: center; margin-top: 30px; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; border: none; border-radius: 8px; color: white; transition: 0.3s;}
        .btn-on { background-color: #4CAF50; }
        .btn-off { background-color: #f44336; }
        .btn:hover { opacity: 0.8; }
        #status { text-align: center; margin-top: 10px; font-weight: bold; color: orange; }
    </style>
</head>
<body>

    <h2>⚡ Smart Office Control (8 ช่อง)</h2>
    <div id="status">กำลังเชื่อมต่อเซิร์ฟเวอร์...</div>

    <div class="grid-container" id="relay-container">
        <!-- สร้างการ์ดปุ่มกด 8 ช่องด้วย JavaScript -->
    </div>

    <div class="controls">
        <button class="btn btn-on" onclick="controlAll(true)">เปิดทั้งหมด</button>
        <button class="btn btn-off" onclick="controlAll(false)">ปิดทั้งหมด</button>
    </div>

    <script>
        const NUM_RELAYS = 8;
        const container = document.getElementById('relay-container');
        const statusText = document.getElementById('status');
        
        // สร้างหน้าตาปุ่มกด 8 ช่อง
        for (let i = 0; i < NUM_RELAYS; i++) {
            const label = i < 3 ? `แอร์ ${i+1}` : (i === 3 ? "ปั๊มน้ำ" : `อุปกรณ์ ${i+1}`);
            container.innerHTML += `
                <div class="card">
                    <h3>${label} (Ch ${i})</h3>
                    <label class="switch">
                        <input type="checkbox" id="relay-${i}" onchange="toggleRelay(${i}, this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            `;
        }

        // เชื่อมต่อ WebSocket 
        // เปลี่ยนโปรโตคอลให้ตรงกับ Host ปัจจุบัน (ws:// หรือ wss://)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/esp`; // หรือใช้ URL ของ Render ตามจริง
        let ws;

        function connectWebSocket() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusText.innerText = "🟢 เชื่อมต่อเซิร์ฟเวอร์สำเร็จ";
                statusText.style.color = "green";
                ws.send(JSON.stringify({ type: 'GET_STATE' }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.relays && Array.isArray(data.relays)) {
                    for (let i = 0; i < NUM_RELAYS; i++) {
                        const checkbox = document.getElementById(`relay-${i}`);
                        if (checkbox) checkbox.checked = data.relays[i];
                    }
                }
            };

            ws.onclose = () => {
                statusText.innerText = "🔴 ขาดการเชื่อมต่อ กำลังเชื่อมต่อใหม่...";
                statusText.style.color = "red";
                setTimeout(connectWebSocket, 3000); // พยายามเชื่อมต่อใหม่ทุก 3 วินาที
            };
        }

        function toggleRelay(ch, state) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'CONTROL', ch: ch, state: state }));
            }
        }

        function controlAll(state) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'CONTROL_ALL', state: state }));
            }
        }

        // เริ่มต้นการเชื่อมต่อ
        connectWebSocket();
    </script>
</body>
</html>
